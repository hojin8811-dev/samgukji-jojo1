<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#120d07" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>삼국지 조조전 · 천하의 서막</title>
<link rel="stylesheet" href="style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120d07'/%3E%3Crect x='6' y='11' width='20' height='15' fill='%23c9a44a'/%3E%3Crect x='13' y='18' width='6' height='8' fill='%23120d07'/%3E%3Crect x='6' y='11' width='20' height='3' fill='%23f0d79a'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">

  <!-- ══════════ 화면 1 · 미니 전국 지도 & 내정 ══════════ -->
  <section id="screen-map" class="screen active">
    <header class="hud">
      <div class="hud-stats">
        <div class="stat gold" title="금">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="#d8b25a"/><circle cx="8" cy="8" r="6.4" fill="none" stroke="#7a5c26"/><rect x="6" y="6" width="4" height="4" fill="#120d07"/></svg>
          <b id="hud-gold">0</b>
        </div>
        <div class="stat rice" title="군량">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7h12c0 4-2.6 6.4-6 6.4S2 11 2 7z" fill="#d8c48e"/><path d="M2 7h12" stroke="#7a5c26"/><path d="M5.6 4.4c0-1.2 1-1.6 2.4-1.6s2.4.4 2.4 1.6" fill="none" stroke="#e8d79a"/></svg>
          <b id="hud-rice">0</b>
        </div>
        <div class="stat troop" title="병력">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7c0-3 2.7-5 6-5s6 2 6 5v1H2z" fill="#9fb4c9"/><path d="M2 8h12l-1 4H3z" fill="#6d8399"/><path d="M6 12h4v2H6z" fill="#3c4a57"/></svg>
          <b id="hud-troops">0</b>
        </div>
      </div>
      <button id="btn-sound" class="icon-btn" aria-label="소리 켜기/끄기">♪</button>
      <button id="btn-menu" class="icon-btn" aria-label="메뉴">☰</button>
    </header>

    <div class="map-wrap">
      <div class="map-frame">
        <svg id="worldmap" viewBox="0 0 360 320" preserveAspectRatio="xMidYMid meet" aria-label="전국 지도"></svg>
        <div class="map-caption"><span id="date-label">건안 원년 정월</span><span class="dot">·</span><span id="fame-label">명성 0</span></div>
      </div>
    </div>

    <div class="city-panel panel" id="city-panel"></div>

    <footer class="map-footer">
      <div class="next-hint" id="next-hint"></div>
      <button id="btn-next-turn" class="btn next-turn">다음 달 <span class="arrow">▸</span></button>
    </footer>
  </section>

  <!-- ══════════ 화면 2 · 조조전 격자 전장 ══════════ -->
  <section id="screen-battle" class="screen">
    <header class="battle-hud">
      <button id="btn-retreat" class="icon-btn" aria-label="후퇴">‹</button>
      <div class="battle-title">
        <span id="battle-name">전장</span>
        <span class="turn" id="battle-turn">1턴</span>
      </div>
      <div class="battle-status ally" id="battle-phase">아군 페이즈</div>
      <button id="btn-help" class="icon-btn" aria-label="조작법">?</button>
      <button id="btn-sound2" class="icon-btn" aria-label="소리 켜기/끄기">♪</button>
    </header>

    <div class="battle-main">
      <div class="field-wrap" id="field-wrap">
        <div class="field-deco" aria-hidden="true">
          <div class="deco-sun"></div>
          <div class="deco-hill h1"></div>
          <div class="deco-hill h2"></div>
          <div class="deco-hill h3"></div>
          <div class="deco-fog"></div>
        </div>
        <div class="field-objective"><span>적을 모두 격파하라</span></div>
        <div class="war-strip">
          <span class="ws-side ally">我軍</span>
          <div class="ws-bar ally"><i id="ally-power"></i></div>
          <span class="ws-vs">戰</span>
          <div class="ws-bar enemy"><i id="enemy-power"></i></div>
          <span class="ws-side enemy">敵軍</span>
        </div>
        <canvas id="field"></canvas>
        <div class="field-legend">
          <span><i class="lg move"></i>이동</span>
          <span><i class="lg atk"></i>공격</span>
          <span><i class="lg heal"></i>회복</span>
        </div>
        <div class="phase-banner" id="phase-banner"></div>
      </div>
      <aside class="battle-side">
        <div class="unit-card panel" id="unit-card"></div>
        <div class="log panel" id="log" aria-live="polite"></div>
        <div class="actions" id="actions"></div>
      </aside>
    </div>
  </section>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- ══════════ 타이틀 ══════════ -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-seal">魏</div>
      <h1 class="splash-title">三國志<span>曹操傳</span></h1>
      <p class="splash-sub">천하의 서막</p>
      <div class="splash-divider"><i></i></div>
      <p class="splash-desc">전국 지도에서 내정을 다스리고,<br />출진하여 조조전의 격자 전장에서 싸운다.</p>
      <button id="btn-start" class="btn primary big">새로 시작</button>
      <button id="btn-continue" class="btn big hidden">이어서 하기</button>
      <p class="splash-foot">1단계 프로토타입 · 모바일 웹</p>
    </div>
  </div>

</div>
<script src="game.js"></script>
</body>
</html>
